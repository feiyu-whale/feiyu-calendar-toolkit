<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💰 肥鱼模拟金融</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%, #1c2a18 0%, #0e160a 55%, #060a04 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#d8e8c8; padding:12px 10px 20px; user-select:none;
  }
  .back { display:inline-block; text-decoration:none; color:#8aa06a; font-size:12px; margin-bottom:8px;
    padding:6px 12px; border:1px solid #3a4c22; border-radius:20px; }
  .back:active { background:#1c2610; }
  h1 { font-size:21px; text-align:center; color:#a8d060; font-weight:700; letter-spacing:2px; margin:2px 0 4px; }
  .sub { text-align:center; color:#7a8f5a; font-size:13px; margin-bottom:10px; line-height:1.7; }
  .warn { text-align:center; color:#b0a05a; font-size:11px; margin-bottom:20px; line-height:1.6;
    background:#1a1a10; border:1px solid #3a3a1c; border-radius:9px; padding:8px 12px; max-width:720px; margin-left:auto; margin-right:auto; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:720px; margin:0 auto; }
  a.tool {
    display:block; text-decoration:none; color:inherit;
    background:linear-gradient(160deg,#1e2e16,#101a0c);
    border:1px solid #4a6a2a; border-radius:14px; padding:18px 14px; transition:.18s;
    box-shadow:0 4px 20px rgba(60,100,20,.22);
  }
  a.tool:active { transform:scale(.96); background:#243818; }
  a.tool .icon { font-size:28px; display:block; margin-bottom:3px; line-height:1; }
  a.tool .name { font-size:13px; font-weight:700; color:#8fe0c0; text-align:center; }
  a.tool .desc { font-size:9.5px; color:#6b9f93; margin-top:2px; line-height:1.25; text-align:center; }
  .more { max-width:720px; margin:22px auto 0; text-align:center; color:#4a5a30; font-size:12px;
    border:1px dashed #3a4a20; border-radius:12px; padding:16px; line-height:1.9; }
  .foot { text-align:center; color:#4a5a30; font-size:12px; margin-top:24px; line-height:1.9; }
  .ver { text-align:center; color:#2e3a1c; font-size:10px; margin-top:10px; }
</style>
</head>
<body>
  <a class="back" href="../">← 回游戏厅</a>
  <h1>💰 模 拟 金 融</h1>
  <div class="sub">虚拟本金 · 模拟买卖 · 真行情<br>练手用，非真钱、不构成投资建议</div>
  <div class="warn">⚠️ 本区全部为<b>模拟交易、虚拟货币</b>，与真实市场无关；<b>不构成任何投资建议</b>。投资有风险，请勿据此做真实决策。</div>

  <div class="grid">
    <a class="tool" href="stock/">
      <span class="icon">📈</span>
      <span class="name">模拟炒股</span>
      <span class="desc">虚拟账户 · 每日 +1 元 · 翻倍收本 · 输光认</span>
    </a>
  </div>

  <div class="more">
    ✨ 更多模拟玩法，未来开启……<br>
    <span style="font-size:11px">（模拟期权・模拟外汇・模拟期货……想加啥就说）</span>
  </div>

  <div class="foot">🐳 大肥鱼出品 · 纯属娱乐与练手<br>虚拟盘而已，别当真</div>
  <div class="ver">v2-紧凑三列 20261016</div>
</body>
</html>
