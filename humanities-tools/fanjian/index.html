<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🀄 繁简转换</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:linear-gradient(160deg,#1a1428 0%,#241a33 55%,#120e1c 100%); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8e0f0;
    padding:6px 6px 12px; display:flex; justify-content:center; user-select:none; }
  #wrap { width:100%; max-width:560px; }
  .back { display:inline-block; text-decoration:none; color:#9a8fc0; font-size:13px; margin-bottom:12px;
    padding:6px 12px; border:1px solid #3a3050; border-radius:20px; }
  h1 { font-size:12px; color:#c8b3ff; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#8a7fb0; font-size:12px; margin-bottom:16px; }
  .card { background:#1c1530; border:1px solid #3a3050; border-radius:12px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#8a7fb0; margin-bottom:9px; letter-spacing:1px; }
  textarea { width:100%; background:#100b1c; border:1px solid #3a3050; border-radius:9px; padding:11px 12px;
    color:#e8e0f0; font-size:15px; font-family:inherit; resize:vertical; min-height:110px; line-height:1.8; }
  textarea:focus { outline:none; border-color:#7a5fc0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btn { background:linear-gradient(160deg,#5a4a9a,#3a2d70); color:#fff; border:1px solid #7a5fc0;
    border-radius:9px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn.g { background:#241a3a; border-color:#4a3d70; color:#c8b3ff; }
  .hint { font-size:12px; color:#6a5f90; margin-top:7px; line-height:1.6; }
  .ver { text-align:center; color:#2a2440; font-size:10px; margin-top:22px; }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../">← 回文科专区</a>
  <h1>🀄 繁简转换</h1>
  <div class="sub">简体 ⇄ 繁体（中文）</div>

  <div class="card">
    <div class="lbl">输入</div>
    <textarea id="in" placeholder="输入要转换的中文…"></textarea>
    <div class="row">
      <button class="btn" data-to="t">→ 转繁体</button>
      <button class="btn" data-to="s">→ 转简体</button>
      <button class="btn g" data-to="clr">清空</button>
    </div>
    <div class="hint" id="hint">数据来源：gumblex/zhconv（MIT，基于 OpenCC）</div>
  </div>

  <div class="card">
    <div class="lbl">结果</div>
    <textarea id="out" readonly></textarea>
  </div>
  <div class="ver">v1-繁简转换 20261016</div>
</div>
<script>
// 【fanjian】繁简转换。依赖：zhconv字典(MIT, 基于OpenCC Apache-2.0)。输入：中文；输出：简体/繁体。
// 本文件为单页工具，IIFE 隔离，无全局污染。
// 数据来源：gumblex/zhconv (MIT)，字典基于 BYVoid/OpenCC (Apache-2.0)
// 转换：逐字/逐词查表，最长匹配优先（3~2~1 字）。
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var S2T = null, T2S = null;

  function load(which){
    if(which === "s2t" && S2T) return Promise.resolve(S2T);
    if(which === "t2s" && T2S) return Promise.resolve(T2S);
    return fetch("data/"+which+".json").then(function(r){return r.json();}).then(function(j){
      if(which === "s2t") S2T = j.map; else T2S = j.map;
      return j.map;
    });
  }

  // 最长匹配转换（词表里最长 4 字，这里试 4→1）
  function convert(text, map){
    var out = "";
    var i = 0, n = text.length;
    while(i < n){
      var matched = false;
      for(var len = 4; len >= 1; len--){
        if(i + len <= n){
          var seg = text.substr(i, len);
          if(map[seg] != null){ out += map[seg]; i += len; matched = true; break; }
        }
      }
      if(!matched){ out += text[i]; i++; }
    }
    return out;
  }

  function run(to){
    if(to === "clr"){ $("in").value=""; $("out").value=""; return; }
    var which = (to === "t") ? "s2t" : "t2s";
    load(which).then(function(map){
      $("out").value = convert($("in").value, map);
    }).catch(function(e){
      $("hint").textContent = "数据加载失败：" + e.message;
    });
  }
  document.querySelectorAll("[data-to]").forEach(function(b){
    b.onclick = function(){ run(b.dataset.to); };
  });
})();
</script>
</body>
</html>
