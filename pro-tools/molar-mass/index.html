<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚗️ 摩尔质量计算</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:radial-gradient(120% 80% at 50% 0%, #14283a 0%, #0a1622 60%, #060a10 100%); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#dbeafe; padding:18px 14px 40px;
    user-select:none; display:flex; justify-content:center; }
  #wrap { width:100%; max-width:560px; }
  .back { display:inline-block; text-decoration:none; color:#6b8fb3; font-size:13px; margin-bottom:12px;
    padding:6px 12px; border:1px solid #22384c; border-radius:20px; }
  h1 { font-size:20px; color:#8fe0c0; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#5b7a99; font-size:12px; margin-bottom:16px; line-height:1.6; }
  .card { background:#0e1a26; border:1px solid #24384c; border-radius:12px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#6b8fb3; margin-bottom:9px; letter-spacing:1px; }
  .f { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .f label { width:64px; font-size:13px; color:#8fe0c0; }
  .f input { flex:1; background:#060a10; border:1px solid #24384c; border-radius:9px; padding:10px 11px;
    color:#eaf4ff; font-size:14px; font-family:inherit; }
  .f input:focus { outline:none; border-color:#4d8fc9; }
  .f .u { font-size:12px; color:#6b8fb3; width:44px; }
  .hint { font-size:12px; color:#5b7a99; margin-top:6px; line-height:1.6; }
  .big { text-align:center; padding:16px; background:#060a10; border-radius:10px; margin-bottom:10px; }
  .big .num { font-size:30px; color:#8fe0c0; font-weight:700; font-family:ui-monospace,monospace; }
  .big .unit { font-size:13px; color:#6b8fb3; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  th { background:#060a10; color:#6b8fb3; padding:7px 6px; text-align:right; font-weight:400; }
  th:first-child { text-align:left; }
  td { padding:6px; text-align:right; border-bottom:1px solid #16222e; color:#a9c8e0;
    font-family:ui-monospace,monospace; }
  td:first-child { text-align:left; color:#8fe0c0; font-family:inherit; font-weight:700; }
  .err { color:#e08; font-size:12px; padding:8px 10px; background:#2a1010; border-radius:8px; margin-top:8px; line-height:1.6; }
  .ver { text-align:center; color:#22383c; font-size:10px; margin-top:22px; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .ex { font-size:11px; padding:5px 10px; background:#0c1a28; border:1px solid #23405c; border-radius:6px;
    color:#8fe0c0; cursor:pointer; }
  .ex:active { background:#16324a; }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../">← 回大厅</a>
  <h1>⚗️ 摩尔质量计算</h1>
  <div class="sub">输入化学式，自动算相对分子质量</div>

  <div class="card">
    <div class="lbl">化学式</div>
    <div class="f">
      <label>化学式</label>
      <input type="text" id="formula" placeholder="例如 H2O、Ca(OH)2、CuSO4·5H2O" autocomplete="off">
    </div>
    <div class="examples" id="ex">
      <span class="ex">H2O</span>
      <span class="ex">Ca(OH)2</span>
      <span class="ex">CuSO4·5H2O</span>
      <span class="ex">C6H12O6</span>
      <span class="ex">Fe2O3</span>
      <span class="ex">H2SO4</span>
    </div>
    <div class="hint">支持括号嵌套、结晶水（·）、下标数字。元素符号区分大小写。</div>
  </div>

  <div class="card">
    <div class="lbl">结果</div>
    <div class="big">
      <div class="num" id="mm">—</div>
      <div class="unit">g/mol（相对分子质量）</div>
    </div>
    <div class="out" id="out"></div>
  </div>

  <div class="card">
    <div class="lbl">说明</div>
    <div class="hint">
      相对原子质量取自 <b>IUPAC 2021 标准原子量</b>（常规值，非区间值）。<br>
      结晶水按"·"分隔各部分分别计算后相加。<br>
      计算精度：保留 3 位小数。
    </div>
  </div>

  <div class="ver">v1-摩尔质量 20261017</div>
</div>
<script>
(function(){
'use strict';
  // 依据：IUPAC 2021 Standard Atomic Weights（常规值 / conventional atomic weights）
  //   来源：IUPAC Commission on Isotopic Abundances and Atomic Weights (CIAAW)
  //   取常规原子量（abridged），精度到小数点后 3~6 位。
  // 运算符：括号嵌套、元素后跟计数（可多位）、"·" 分隔结晶水部分。
  const AW = {
    H:1.008, He:4.003, Li:6.94, Be:9.012, B:10.81, C:12.011, N:14.007, O:15.999,
    F:18.998, Ne:20.180, Na:22.990, Mg:24.305, Al:26.982, Si:28.085, P:30.974, S:32.06,
    Cl:35.45, Ar:39.948, K:39.098, Ca:40.078, Sc:44.956, Ti:47.867, V:50.942, Cr:51.996,
    Mn:54.938, Fe:55.845, Co:58.933, Ni:58.693, Cu:63.546, Zn:65.38, Ga:69.723, Ge:72.63,
    As:74.922, Se:78.971, Br:79.904, Kr:83.798, Rb:85.468, Sr:87.62, Y:88.906, Zr:91.224,
    Nb:92.906, Mo:95.95, Tc:98, Ru:101.07, Rh:102.906, Pd:106.42, Ag:107.868, Cd:112.414,
    In:114.818, Sn:118.710, Sb:121.760, Te:127.60, I:126.904, Xe:131.293, Cs:132.905,
    Ba:137.327, La:138.905, Ce:140.116, Pr:140.908, Nd:144.242, Pm:145, Sm:150.36,
    Eu:151.964, Gd:157.25, Tb:158.925, Dy:162.500, Ho:164.930, Er:167.259, Tm:168.934,
    Yb:173.045, Lu:174.967, Hf:178.49, Ta:180.948, W:183.84, Re:186.207, Os:190.23,
    Ir:192.217, Pt:195.084, Au:196.967, Hg:200.592, Tl:204.38, Pb:207.2, Bi:208.980,
    Po:209, At:210, Rn:222, Fr:223, Ra:226, Ac:227, Th:232.038, Pa:231.036, U:238.029,
    Np:237, Pu:244, Am:243, Cm:247, Bk:247, Cf:251, Es:252, Fm:257, Md:258, No:259,
    Lr:266, Rf:267, Db:268, Sg:269, Bh:270, Hs:277, Mt:278, Ds:281, Rg:282, Cn:285,
    Nh:286, Fl:289, Mc:290, Lv:293, Ts:294, Og:294
  };

  const $ = id => document.getElementById(id);

  // 解析一个"段"（不含·），返回 [总质量, 元素明细]
  function parseSegment(seg){
    const detail = {};  // 元素 -> 原子个数
    let i = 0;
    const n = seg.length;

    function parseGroup(){
      const counts = {};
      while(i < n){
        const c = seg[i];
        if(c === '(' || c === '[' || c === '{'){
          i++;
          const inner = {};
          const sub = parseGroup();  // 递归
          // 读完括号后的数字
          let numStr = "";
          while(i < n && /\d/.test(seg[i])) numStr += seg[i++];
          const mult = numStr === "" ? 1 : parseInt(numStr, 10);
          for(const k in sub) inner[k] = sub[k] * mult;
          for(const k in inner) counts[k] = (counts[k] || 0) + inner[k];
        }
        else if(c === ')' || c === ']' || c === '}'){
          i++;
          return counts;
        }
        else if(/[A-Z]/.test(c)){
          let sym = c;
          i++;
          while(i < n && /[a-z]/.test(seg[i])) sym += seg[i++];
          let numStr = "";
          while(i < n && /\d/.test(seg[i])) numStr += seg[i++];
          const cnt = numStr === "" ? 1 : parseInt(numStr, 10);
          counts[sym] = (counts[sym] || 0) + cnt;
        }
        else if(c === '.' || c === ' '){
          i++;
        }
        else {
          throw new Error("无法识别的字符：" + c + "（位置 " + i + "）");
        }
      }
      return counts;
    }

    const res = parseGroup();
    for(const k in res) detail[k] = res[k];
    return detail;
  }

  function calc(){
    const raw = $("formula").value.trim();
    if(raw === ""){
      $("mm").textContent = "—";
      $("out").innerHTML = "";
      return;
    }

    try {
      // 按 · 或 . 分割结晶水（注意：化学式里的点是中点 · 或 U+00B7）
      const parts = raw.split(/[·•⋅.]/).filter(s => s.trim() !== "");
      let total = 0;
      const allDetail = {};
      const partList = [];

      for(const p of parts){
        const d = parseSegment(p.trim());
        let segMass = 0;
        for(const el in d){
          if(!(el in AW)) throw new Error("未知元素符号：" + el);
          const m = AW[el] * d[el];
          segMass += m;
          allDetail[el] = (allDetail[el] || 0) + d[el];
        }
        partList.push({formula: p.trim(), mass: segMass});
        total += segMass;
      }

      $("mm").textContent = total.toFixed(3);

      let html = `<table><tr><th>元素</th><th>原子数</th><th>原子量</th><th>小计</th></tr>`;
      Object.keys(allDetail).sort().forEach(el => {
        const cnt = allDetail[el];
        const aw = AW[el];
        html += `<tr><td>${el}</td><td>${cnt}</td><td>${aw}</td><td>${(aw*cnt).toFixed(3)}</td></tr>`;
      });
      html += `</table>`;

      if(partList.length > 1){
        html += `<div class="hint" style="margin-top:10px"><b>分段：</b><br>`;
        partList.forEach(p => { html += `${p.formula} → ${p.mass.toFixed(3)}<br>`; });
        html += `</div>`;
      }

      // 补充信息
      html += `<div class="hint" style="margin-top:10px">
        1 mol 该物质重 <b style="color:#8fe0c0">${total.toFixed(3)} g</b><br>
        摩尔质量 = ${total.toFixed(3)} g/mol
      </div>`;

      $("out").innerHTML = html;
    } catch(e){
      $("mm").textContent = "—";
      $("out").innerHTML = `<div class="err">❌ ${e.message}</div>`;
    }
  }

  // 示例按钮
  $("ex").querySelectorAll(".ex").forEach(el => {
    el.onclick = () => { $("formula").value = el.textContent; calc(); };
  });

  $("formula").addEventListener("input", calc);
})();
</script>
</body>
</html>
