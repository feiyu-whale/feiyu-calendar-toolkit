<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 欧姆定律·功率</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:radial-gradient(120% 80% at 50% 0%, #14283a 0%, #0a1622 60%, #060a10 100%); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#dbeafe; padding:18px 14px 40px;
    user-select:none; display:flex; justify-content:center; }
  #wrap { width:100%; max-width:560px; }
  .back { display:inline-block; text-decoration:none; color:#6b8fb3; font-size:13px; margin-bottom:12px;
    padding:6px 12px; border:1px solid #22384c; border-radius:20px; }
  h1 { font-size:20px; color:#9fe0ff; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#5b7a99; font-size:12px; margin-bottom:16px; }
  .card { background:#0e1a26; border:1px solid #24384c; border-radius:12px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#6b8fb3; margin-bottom:9px; letter-spacing:1px; }
  .f { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .f label { width:66px; font-size:13px; color:#9fe0ff; }
  .f input { flex:1; background:#060a10; border:1px solid #24384c; border-radius:9px; padding:10px 11px;
    color:#eaf4ff; font-size:14px; font-family:inherit; }
  .f input:focus { outline:none; border-color:#4d8fc9; }
  .f .u { font-size:12px; color:#6b8fb3; width:34px; }
  .hint { font-size:12px; color:#5b7a99; margin-top:6px; line-height:1.6; }
  .out { margin-top:12px; }
  .r { display:flex; justify-content:space-between; padding:9px 12px; background:#060a10; border-radius:9px;
    margin-bottom:7px; font-size:14px; }
  .r .k { color:#8fb3cf; }
  .r .v { color:#8fe0c0; font-weight:700; font-family:ui-monospace,monospace; }
  .ver { text-align:center; color:#22383c; font-size:10px; margin-top:22px; }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../">← 回大厅</a>
  <h1>⚡ 欧姆定律 · 功率</h1>
  <div class="sub">输入已知的两个量，自动算出其余（V=IR, P=VI）</div>

  <div class="card">
    <div class="lbl">输入（留空=待求，填任意两个）</div>
    <div class="f"><label>电压 U</label><input type="text" id="u" inputmode="decimal"><span class="u">V</span></div>
    <div class="f"><label>电流 I</label><input type="text" id="i" inputmode="decimal"><span class="u">A</span></div>
    <div class="f"><label>电阻 R</label><input type="text" id="r" inputmode="decimal"><span class="u">Ω</span></div>
    <div class="f" style="margin-bottom:0"><label>功率 P</label><input type="text" id="p" inputmode="decimal"><span class="u">W</span></div>
    <div class="hint">填其中任意两个，空着的自动算；也可以改一个重新算。</div>
  </div>

  <div class="card">
    <div class="lbl">结果</div>
    <div class="out" id="out"></div>
  </div>
  <div class="ver">v1-欧姆定律 20261016</div>
</div>
<script>
(function(){
'use strict';
  const $ = id => document.getElementById(id);
  const ids = ["u","i","r","p"];
  function num(id){ const v = $(id).value.trim(); if(v==="") return null; const n = Number(v); return isNaN(n) ? null : n; }
  function set(id, v){ $(id).value = (v===null||!isFinite(v)) ? "" : (Math.round(v*1e6)/1e6); }

  function calc(src){
    let u = num("u"), i = num("i"), r = num("r"), p = num("p");
    const have = [u,i,r,p].filter(x => x!==null).length;
    if(have < 2){ $("out").innerHTML = "<span style='color:#5b7a99'>至少填两个量</span>"; return; }
    // 用最新的两个（越靠前越优先作为输入）——简单法：按缺失解方程
    try {
      if(u!==null && i!==null){ r=u/i; p=u*i; }
      else if(u!==null && r!==null){ i=u/r; p=u*i; }
      else if(u!==null && p!==null){ i=p/u; r=u/i; }
      else if(i!==null && r!==null){ u=i*r; p=u*i; }
      else if(i!==null && p!==null){ u=p/i; r=u/i; }
      else if(r!==null && p!==null){ i=Math.sqrt(p/r); u=i*r; }
    } catch(e){ $("out").innerHTML = "<span style='color:#e08'>无法计算</span>"; return; }
    // 回填除了源以外的
    const map = {u,i,r,p};
    ids.forEach(k => { if(k !== src) set(k, map[k]); });
    $("out").innerHTML =
      row("电压 U", u, "V") + row("电流 I", i, "A") + row("电阻 R", r, "Ω") + row("功率 P", p, "W") +
      row("换算", null, "") .replace('class="v">','class="v">') ;
    // 额外：能耗提示
    $("out").innerHTML = row("电压 U", u, "V")+row("电流 I", i, "A")+row("电阻 R", r, "Ω")+row("功率 P", p, "W");
  }
  function row(k, v, u){
    if(v===null || !isFinite(v)) return "";
    const n = Math.round(v*1e4)/1e4;
    return `<div class="r"><span class="k">${k}</span><span class="v">${n} ${u}</span></div>`;
  }
  ids.forEach(id => $(id).addEventListener("input", () => calc(id)));
})();
</script>
</body>
</html>
