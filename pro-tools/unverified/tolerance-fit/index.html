<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公差配合查询工具 v2.0.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;line-height:1.6;color:#333;background:#f5f5f5;padding-bottom:50px}
header{background:#2c3e50;color:#fff;padding:20px;text-align:center}
header h1{font-size:1.8em;margin-bottom:4px}
header p{font-size:.9em;opacity:.8}
.tab-bar{display:flex;background:#34495e;padding:0 10px;overflow-x:auto}
.tab-btn{background:none;border:none;color:#bdc3c7;padding:12px 18px;cursor:pointer;font-size:.95em;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab-btn.active{color:#fff;border-bottom-color:#3498db}
.tab-panel{display:none;padding:20px;max-width:1000px;margin:0 auto}
.tab-panel.active{display:block}
.query-form{background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px}
.form-row{display:flex;gap:16px;flex-wrap:wrap}
.form-group{flex:1;min-width:180px;margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;font-weight:600;font-size:.9em}
.form-group input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:1em}
.form-group input:focus{outline:none;border-color:#3498db;box-shadow:0 0 0 2px rgba(52,152,219,.2)}
.btn{background:#3498db;color:#fff;border:none;padding:10px 28px;border-radius:4px;cursor:pointer;font-size:1em;transition:background .2s}
.btn:hover{background:#2980b9}
.results{background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.results h3{margin-bottom:12px;color:#2c3e50;font-size:1.1em}
.result-section{margin-bottom:16px}
.result-table{width:100%;border-collapse:collapse;margin-bottom:10px}
.result-table th,.result-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #eee;font-size:.95em}
.result-table th{background:#f8f9fa;font-weight:600;width:40%}
.fit-badge{display:inline-block;padding:4px 14px;border-radius:4px;font-weight:70
