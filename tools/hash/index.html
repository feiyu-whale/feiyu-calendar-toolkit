<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>#️⃣ 哈希生成</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:radial-gradient(120% 80% at 50% 0%, #14283a 0%, #0a1622 60%, #060a10 100%); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#dbeafe; padding:18px 14px 40px;
    user-select:none; display:flex; justify-content:center; }
  #wrap { width:100%; max-width:560px; }
  .back { display:inline-block; text-decoration:none; color:#6b8fb3; font-size:13px; margin-bottom:12px;
    padding:6px 12px; border:1px solid #22384c; border-radius:20px; }
  h1 { font-size:20px; color:#9fe0ff; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#5b7a99; font-size:12px; margin-bottom:16px; }
  .card { background:#0e1a26; border:1px solid #24384c; border-radius:12px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#6b8fb3; margin-bottom:7px; letter-spacing:1px; }
  textarea { width:100%; background:#060a10; border:1px solid #24384c; border-radius:9px; padding:11px 12px;
    color:#eaf4ff; font-size:14px; font-family:inherit; resize:vertical; min-height:80px; line-height:1.6; }
  textarea:focus { outline:none; border-color:#4d8fc9; }
  .h { margin-top:12px; }
  .h .t { font-size:12px; color:#9fe0ff; margin-bottom:4px; }
  .h .v { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; color:#8fe0c0;
    word-break:break-all; background:#060a10; border-radius:8px; padding:9px 11px; line-height:1.6; }
  .h .v:active { background:#12212e; }
  .cp { float:right; font-size:11px; color:#6b8fb3; cursor:pointer; border:1px solid #2e5f8e; border-radius:6px;
    padding:1px 7px; }
  .ver { text-align:center; color:#22383c; font-size:10px; margin-top:22px; }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../">← 回工具区</a>
  <h1>#️⃣ 哈希生成</h1>
  <div class="sub">SHA-1 / SHA-256 / SHA-512 用浏览器原生 Web Crypto</div>

  <div class="card">
    <div class="lbl">输入文本（输入即算）</div>
    <textarea id="in" placeholder="输入要计算哈希的文本…"></textarea>
  </div>

  <div class="card">
    <div class="lbl">结果</div>
    <div class="h" id="out"></div>
  </div>
  <div class="ver">v1-哈希 20261016</div>
</div>
<script>
const $ = id => document.getElementById(id);
const algs = ["SHA-1","SHA-256","SHA-512"];

async function hash(alg, text){
  const buf = await crypto.subtle.digest(alg, new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

async function run(){
  const t = $("in").value;
  if(!t){ $("out").innerHTML = "<span style='color:#5b7a99'>…</span>"; return; }
  let html = "";
  for(const a of algs){
    const v = await hash(a, t);
    html += "<div class='h' style='margin-top:10px'><div class='t'>"+a+" <span class='cp' data-v='"+v+"'>复制</span></div><div class='v'>"+v+"</div></div>";
  }
  $("out").innerHTML = html;
}
$("in").addEventListener("input", run);
$("out").addEventListener("click", e => {
  if(e.target.classList.contains("cp")){
    navigator.clipboard?.writeText(e.target.dataset.v);
    e.target.textContent = "已复制"; setTimeout(()=>e.target.textContent="复制",1200);
  }
});
</script>
</body>
</html>
